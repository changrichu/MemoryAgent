version: '3.8'

services:
  # ============ Redis - L1 工作记忆 ============
  redis:
    image: redis:7-alpine
    container_name: memoryagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============ PostgreSQL + pgvector - L2 情景记忆 ============
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memoryagent-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: memoryagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init_pg.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============ Milvus - L3 长期记忆 ============
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 \
             -listen-client-urls http://0.0.0.0:2379 \
             --data-dir /etcd

  milvus:
    container_name: memoryagent-milvus
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-09-04T19-51-10Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-minio:/minio_data
    command: minio server /minio_data --address ":9000"
    ports:
      - "9000:9000"

  # ============ Neo4j - 知识图谱(可选) ============
  neo4j:
    image: neo4j:5.20-community
    container_name: memoryagent-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4j123
    volumes:
      - neo4j-data:/data
    profiles: ["full"]   # 默认不启动,需要时 docker-compose --profile full up

  # ============ MemoryAgent API 服务 ============
  app:
    build: .
    container_name: memoryagent-app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn ragagent.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  redis-data:
  postgres-data:
  milvus-etcd:
  milvus-minio:
  neo4j-data:
